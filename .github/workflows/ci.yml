name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python 3.11
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          enable-cache: true

      - name: Run focused tests
        run: |
          uv run --python 3.11 --with pytest pytest -q \
            tests/test_multiscreen.py \
            tests/test_properties.py \
            tests/test_workshop.py

      - name: Check documentation links
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          root = pathlib.Path.cwd()
          files = [root / "README.md"]
          broken = []
          for source in files:
              for target in re.findall(r"(?<!!)\[[^]]+\]\(([^)]+)\)", source.read_text()):
                  if "://" in target or target.startswith("#"):
                      continue
                  path = (source.parent / target.split("#", 1)[0]).resolve()
                  if not path.exists():
                      broken.append(f"{source.relative_to(root)} -> {target}")
          if broken:
              print("Broken documentation links:")
              print("\n".join(broken))
              sys.exit(1)
          print(f"Checked {len(files)} documentation files")
          PY
